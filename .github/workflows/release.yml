name: Release

# Tags and publishes v<package.json version> once it reaches main. The title is
# "v<version> — <summary line under the CHANGELOG heading>" and the notes are the
# rest of that CHANGELOG section. A run whose tag already exists does nothing, so
# workflow_dispatch is a safe manual retry.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The scripts use only Node built-ins, so no npm ci is needed.
      - run: node scripts/check-versions.ts
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Exit status 2 means no such ref; any other failure stops the run.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          if [ "$status" -ne 2 ]; then
            echo "Could not list tags (git ls-remote exited $status)." >&2
            exit "$status"
          fi
          title="$(node scripts/release-notes.ts title)"
          node scripts/release-notes.ts notes > "$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # Creating the release creates the tag at this commit in the same call.
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
